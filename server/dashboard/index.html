<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1b1b1a;--mut:#6f6f6a;--line:#e6e6e1;--acc:#2563eb;--acc2:#93b4f5;--bar:#2563eb18}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1b1b1b;--fg:#ececea;--mut:#9a9a94;--line:#2b2b2a;--acc:#6b9bff;--acc2:#35508a;--bar:#6b9bff22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
h1{font-size:18px;margin:0 auto 0 0}
select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-weight:600}
.kpi span,.card h2{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
#chart{width:100%;height:220px;display:block}
#chart text{fill:var(--mut);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 6px;position:relative}
td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0;width:70%}
td.n{text-align:right;color:var(--mut);width:15%}
td.n:nth-child(2){color:var(--fg)}
tr .bg{position:absolute;inset:2px auto 2px 0;background:var(--bar);border-radius:4px;z-index:0}
td span{position:relative}
th{text-align:right;font-weight:500;color:var(--mut);font-size:11px;padding:0 6px 4px}th:first-child{text-align:left}
.empty{color:var(--mut);padding:8px 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:720px){.grid{grid-template-columns:1fr}.kpi b{font-size:20px}}
</style>
</head>
<body>
<main>
<header>
  <h1>Analytics</h1>
  <select id="site" aria-label="Site"></select>
  <select id="range" aria-label="Range">
    <option value="1">Today</option>
    <option value="2">Last 48 hours</option>
    <option value="7" selected>Last 7 days</option>
    <option value="30">Last 30 days</option>
    <option value="90">Last 90 days</option>
    <option value="365">Last 12 months</option>
  </select>
  <button id="reload">Refresh</button>
</header>

<section class="kpis">
  <div class="card kpi"><span>Visitors</span><b id="k-vis">–</b></div>
  <div class="card kpi"><span>Pageviews</span><b id="k-views">–</b></div>
  <div class="card kpi"><span>Events</span><b id="k-ev">–</b></div>
</section>

<section class="card">
  <div class="legend"><span><i style="background:var(--acc)"></i>Pageviews</span><span><i style="background:var(--acc2)"></i>Visitors</span></div>
  <svg id="chart" role="img" aria-label="Pageviews over time"></svg>
</section>

<section class="grid">
  <div class="card"><h2>Pages</h2><div id="t-pages"></div></div>
  <div class="card"><h2>Referrers</h2><div id="t-refs"></div></div>
  <div class="card"><h2>Events</h2><div id="t-events"></div></div>
  <div class="card"><h2>Event properties</h2><div id="t-props"></div></div>
  <div class="card"><h2>Countries</h2><div id="t-countries"></div></div>
  <div class="card"><h2>Devices</h2><div id="t-devices"></div></div>
  <div class="card"><h2>Browsers</h2><div id="t-browsers"></div></div>
  <div class="card"><h2>Operating systems</h2><div id="t-os"></div></div>
</section>
</main>
<div class="tip" id="tip"></div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const regionName = (() => { try { return new Intl.DisplayNames(undefined, { type: 'region' }) } catch { return null } })();
const flag = (cc) => cc && cc.length === 2 ? String.fromCodePoint(...[...cc].map((c) => 127397 + c.charCodeAt(0))) : '';

const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };

async function init() {
  const sites = await (await fetch('api/sites')).json();
  $('site').innerHTML = sites.length ? sites.map((s) => `<option>${esc(s)}</option>`).join('') : '<option value="">no data yet</option>';
  const last = store.get('site'); if (last && sites.includes(last)) $('site').value = last;
  const r = store.get('range'); if (r) $('range').value = r;
  for (const id of ['site', 'range']) $(id).onchange = () => { store.set(id, $(id).value); load(); };
  $('reload').onclick = load;
  load();
}

async function load() {
  const days = +$('range').value;
  const to = Math.floor(Date.now() / 1000);
  let from;
  if (days === 1) { const d = new Date(); d.setHours(0, 0, 0, 0); from = d.getTime() / 1000; }
  else if (days === 2) from = to - 48 * 3600;
  else { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - days + 1); from = d.getTime() / 1000; }
  const q = new URLSearchParams({ site: $('site').value, from, to, tz: new Date().getTimezoneOffset() });
  const s = await (await fetch('api/stats?' + q)).json();
  $('k-vis').textContent = fmt.format(s.visitors || 0);
  $('k-views').textContent = fmt.format(s.views || 0);
  $('k-ev').textContent = fmt.format(s.events || 0);
  chart(s, from, to);
  table('t-pages', s.pages, 'Page');
  table('t-refs', s.refs, 'Source', (k) => k || '(direct)');
  table('t-events', s.eventNames, 'Name');
  table('t-props', (s.eventProps || []).map((r) => ({ ...r, k: r.k + '  ·  ' + decodeProps(r.p) })), 'Event · props');
  table('t-countries', s.countries, 'Country', (k) => k ? `${flag(k)} ${regionName?.of(k) ?? k}` : 'Unknown');
  table('t-devices', s.devices, 'Device');
  table('t-browsers', s.browsers, 'Browser');
  table('t-os', s.os, 'OS');
}

function decodeProps(p) {
  try { return [...new URLSearchParams(p)].map(([k, v]) => `${k}=${v}`).join(', ') } catch { return p }
}

function table(id, rows, label, fmtKey = (k) => k) {
  rows = rows || [];
  if (!rows.length) { $(id).innerHTML = '<div class="empty">No data</div>'; return; }
  const max = Math.max(...rows.map((r) => r.v));
  $(id).innerHTML = `<table><tr><th>${label}</th><th>Count</th><th>Uniq</th></tr>` + rows.map((r) =>
    `<tr><td title="${esc(fmtKey(r.k))}"><div class="bg" style="width:${(r.v / max * 100).toFixed(1)}%"></div><span>${esc(fmtKey(r.k))}</span></td><td class="n">${fmt.format(r.v)}</td><td class="n">${fmt.format(r.u)}</td></tr>`
  ).join('') + '</table>';
}

function chart(s, from, to) {
  const svg = $('chart');
  const W = svg.clientWidth || 800, H = 220, pl = 36, pb = 22, pt = 8;
  const step = s.bucket === 'hour' ? 3600 : 86400;
  // Build a continuous axis, aligned to local bucket starts, so empty buckets show as zero.
  const pts = [];
  const start = new Date(from * 1000);
  if (step === 86400) start.setHours(0, 0, 0, 0); else start.setMinutes(0, 0, 0);
  for (let d = start; d.getTime() / 1000 < to && pts.length < 2000; step === 86400 ? d.setDate(d.getDate() + 1) : d.setHours(d.getHours() + 1)) {
    pts.push({ t: Math.round(d.getTime() / 1000), v: 0, u: 0 });
  }
  // Server buckets use a fixed tz offset; snap each to its slot (tolerates DST shifts).
  for (const p of s.series || []) {
    let i = pts.length - 1;
    while (i > 0 && pts[i].t > p.t + (step === 86400 ? 7200 : 0)) i--;
    if (pts[i]) { pts[i].v += p.v; pts[i].u += p.u; }
  }
  const max = Math.max(1, ...pts.map((p) => p.v));
  const nice = niceMax(max);
  const bw = (W - pl) / Math.max(pts.length, 1);
  const y = (v) => pt + (H - pt - pb) * (1 - v / nice);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = nice * i / 4, yy = y(v);
    g += `<line x1="${pl}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${fmt.format(Math.round(v))}</text>`;
  }
  const labelEvery = Math.ceil(pts.length / Math.max(2, Math.floor(W / 70)));
  pts.forEach((p, i) => {
    const x = pl + i * bw, gap = Math.min(4, bw * 0.2);
    g += `<rect data-i="${i}" x="${x + gap / 2}" y="${y(p.v)}" width="${Math.max(1, bw - gap)}" height="${H - pb - y(p.v)}" rx="2" fill="var(--acc)"/>`;
    g += `<rect x="${x + gap / 2 + (bw - gap) * 0.25}" y="${y(p.u)}" width="${Math.max(1, (bw - gap) * 0.5)}" height="${H - pb - y(p.u)}" rx="1" fill="var(--acc2)" pointer-events="none"/>`;
    if (i % labelEvery === 0) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${tick(p.t, step)}</text>`;
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = g;
  const tip = $('tip');
  svg.onmousemove = (e) => {
    const i = e.target.dataset?.i;
    if (i == null) { tip.style.display = 'none'; return; }
    const p = pts[i];
    tip.textContent = `${tick(p.t, step, true)} · ${fmt.format(p.v)} views · ${fmt.format(p.u)} visitors`;
    tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY - 28 + 'px';
  };
  svg.onmouseleave = () => (tip.style.display = 'none');
}

function tick(t, step, long) {
  const d = new Date(t * 1000);
  if (step === 3600) return long ? d.toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : d.toLocaleTimeString(undefined, { hour: '2-digit' });
  return d.toLocaleDateString(undefined, long ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' });
}

function niceMax(v) {
  const p = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return Math.max(4, m * p);
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(load, 200); });
init();
</script>
</body>
</html>
